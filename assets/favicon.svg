<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <defs>
    <linearGradient id="glowGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06b6d4" />
      <stop offset="50%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#a855f7" />
    </linearGradient>
    <filter id="glowFilter" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background Card -->
  <rect width="64" height="64" rx="16" fill="#080c14" />
  <rect x="2" y="2" width="60" height="60" rx="14" stroke="url(#glowGrad)" stroke-width="2.5" opacity="0.8" />

  <!-- Neural Network Nodes & Connections -->
  <g filter="url(#glowFilter)">
    <!-- Interconnecting Synapses -->
    <line x1="18" y1="20" x2="32" y2="24" stroke="#06b6d4" stroke-width="2" opacity="0.6" />
    <line x1="18" y1="32" x2="32" y2="24" stroke="#06b6d4" stroke-width="2" opacity="0.6" />
    <line x1="18" y1="32" x2="32" y2="40" stroke="#06b6d4" stroke-width="2" opacity="0.6" />
    <line x1="18" y1="44" x2="32" y2="40" stroke="#06b6d4" stroke-width="2" opacity="0.6" />

    <line x1="32" y1="24" x2="46" y2="32" stroke="#a855f7" stroke-width="2" opacity="0.8" />
    <line x1="32" y1="40" x2="46" y2="32" stroke="#a855f7" stroke-width="2" opacity="0.8" />

    <!-- Left Input Nodes (Cyan) -->
    <circle cx="18" cy="20" r="4.5" fill="#06b6d4" />
    <circle cx="18" cy="32" r="4.5" fill="#06b6d4" />
    <circle cx="18" cy="44" r="4.5" fill="#06b6d4" />

    <!-- Middle Hidden Layer Nodes (Cyan/Purple) -->
    <circle cx="32" cy="24" r="5" fill="#38bdf8" stroke="#080c14" stroke-width="1.5" />
    <circle cx="32" cy="40" r="5" fill="#c084fc" stroke="#080c14" stroke-width="1.5" />

    <!-- Right Output Node (Glowing Violet) -->
    <circle cx="46" cy="32" r="6" fill="#a855f7" stroke="#ffffff" stroke-width="1.5" />
  </g>
</svg>
